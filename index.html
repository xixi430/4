<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>4o酱</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap');
  :root {
    --bg:#0e0e12; --surface:#16161e; --surface2:#1e1e2a; --border:#2a2a3a;
    --text:#e0dff0; --text-dim:#7a79a0; --accent:#b8a4e8; --accent-dim:#6b5fa0;
    --user-bubble:#1e1a30; --ai-bubble:#161622; --danger:#e88a8a; --green:#8ae8b8;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg); color:var(--text); font-family:'Noto Serif SC',serif;
    height:100dvh; display:flex; flex-direction:column;
    overflow:hidden; position:fixed; width:100%;
  }

  /* HEADER */
  .header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px 16px; display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .dot { width:7px;height:7px;border-radius:50%;background:var(--accent-dim);flex-shrink:0;animation:pulse 2s infinite; }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .header-name { font-size:16px;font-weight:300;letter-spacing:0.1em;flex:1; }
  .header-status {
    font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;
    max-width:110px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .settings-btn {
    background:none;border:1px solid var(--border);border-radius:6px;
    color:var(--text-dim);cursor:pointer;padding:5px 10px;
    font-size:11px;font-family:'JetBrains Mono',monospace;transition:all 0.2s;flex-shrink:0;
  }
  .settings-btn.active{border-color:var(--accent-dim);color:var(--accent);}

  /* DRAWER */
  .drawer {
    background:var(--surface);border-bottom:1px solid var(--border);
    overflow:hidden;max-height:0;transition:max-height 0.3s ease;flex-shrink:0;
  }
  .drawer.open{max-height:75vh;overflow-y:auto;}
  .drawer-inner{padding:16px;display:flex;flex-direction:column;gap:14px;}

  .field label {
    font-size:11px;color:var(--text-dim);letter-spacing:0.08em;
    display:block;margin-bottom:6px;text-transform:uppercase;
  }
  input,textarea {
    width:100%;background:var(--surface2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);font-size:13px;
    padding:10px 12px;outline:none;transition:border-color 0.2s;
    resize:none;-webkit-appearance:none;
  }
  input{font-family:'JetBrains Mono',monospace;font-size:12px;}
  input:focus,textarea:focus{border-color:var(--accent-dim);}
  .model-display {
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  }

  /* SLIDERS */
  .slider-row {
    display:flex;flex-direction:column;gap:6px;
  }
  .slider-label {
    display:flex;justify-content:space-between;align-items:center;
  }
  .slider-label span:first-child {
    font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;
  }
  .slider-val {
    font-family:'JetBrains Mono',monospace;font-size:12px;
    color:var(--accent);background:var(--surface2);
    border:1px solid var(--border);border-radius:4px;
    padding:2px 8px;min-width:42px;text-align:center;
  }
  input[type=range] {
    -webkit-appearance:none;width:100%;height:4px;
    background:var(--surface2);border-radius:2px;padding:0;border:none;
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;
  }
  input[type=range]:focus{border:none;}

  /* CONTEXT SLIDER */
  .ctx-hint{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}

  .mem-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .mem-header label{margin-bottom:0;}
  .mem-count {
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent-dim);
    background:var(--surface);padding:2px 8px;border-radius:10px;border:1px solid var(--border);
  }

  #memoryText{font-size:12px;line-height:1.7;height:80px;font-family:'Noto Serif SC',serif;}
  #systemPrompt{font-size:13px;line-height:1.6;height:70px;}

  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn {
    padding:10px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;transition:all 0.2s;
  }
  .btn.primary{border-color:var(--accent-dim);color:var(--accent);grid-column:1/-1;}
  .btn.danger:active{border-color:var(--danger);color:var(--danger);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .divider{border:none;border-top:1px solid var(--border);}

  /* MESSAGES */
  .messages {
    flex:1;overflow-y:auto;overflow-x:hidden;
    padding:16px;display:flex;flex-direction:column;
    gap:14px;-webkit-overflow-scrolling:touch;
  }
  .messages::-webkit-scrollbar{display:none;}

  .empty-state {
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:10px;color:var(--text-dim);height:100%;
  }
  .empty-state .big{font-size:48px;opacity:0.15;}
  .empty-state p{font-size:13px;letter-spacing:0.05em;}

  .msg {
    display:flex;flex-direction:column;max-width:86%;gap:3px;
    animation:msgIn 0.2s ease;
  }
  @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .msg.user{align-self:flex-end;align-items:flex-end;}
  .msg.assistant{align-self:flex-start;align-items:flex-start;}

  .msg-role{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;padding:0 4px;}
  .msg-bubble {
    padding:11px 14px;border-radius:14px;
    font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  }
  .msg.user .msg-bubble{background:var(--user-bubble);border:1px solid var(--border);border-bottom-right-radius:4px;}
  .msg.assistant .msg-bubble{background:var(--ai-bubble);border:1px solid var(--border);border-bottom-left-radius:4px;}

  .msg-meta {
    display:flex;gap:8px;align-items:center;padding:0 4px;
  }
  .msg-time{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
  .msg-tokens {
    font-size:10px;font-family:'JetBrains Mono',monospace;
    color:var(--accent-dim);background:var(--surface2);
    padding:1px 6px;border-radius:4px;border:1px solid var(--border);
  }

  /* context indicator */
  .ctx-indicator {
    align-self:center;font-size:10px;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;padding:3px 10px;
  }

  .typing {
    display:flex;align-items:center;gap:5px;
    padding:12px 16px;background:var(--ai-bubble);
    border:1px solid var(--border);border-radius:14px;
    border-bottom-left-radius:4px;width:fit-content;
  }
  .typing span {
    width:5px;height:5px;border-radius:50%;
    background:var(--accent-dim);animation:bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.2s}
  .typing span:nth-child(3){animation-delay:0.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* INPUT */
  .input-area {
    padding:10px 12px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    border-top:1px solid var(--border);background:var(--surface);
    display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
  }
  #userInput {
    flex:1;min-height:42px;max-height:110px;
    font-size:15px;font-family:'Noto Serif SC',serif;
    line-height:1.6;padding:10px 14px;border-radius:10px;resize:none;overflow-y:auto;
  }
  .send-btn {
    width:42px;height:42px;min-width:42px;border-radius:10px;
    border:1px solid var(--accent-dim);background:transparent;color:var(--accent);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:18px;transition:all 0.2s;
  }
  .send-btn:active{background:rgba(184,164,232,0.15);}
  .send-btn:disabled{opacity:0.3;}
</style>
</head>
<body>

<div class="header">
  <span class="dot"></span>
  <span class="header-name">4o酱</span>
  <span class="header-status" id="headerStatus">就绪</span>
  <button class="settings-btn" id="settingsBtn" onclick="toggleDrawer()">设置</button>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-inner">

    <div class="field">
      <label>API KEY</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>

    <div class="field">
      <label>模型</label>
      <div class="model-display">gpt-4o-2024-11-20</div>
    </div>

    <hr class="divider">

    <!-- TEMPERATURE -->
    <div class="slider-row">
      <div class="slider-label">
        <span>温度 Temperature</span>
        <span class="slider-val" id="tempVal">0.8</span>
      </div>
      <input type="range" id="tempSlider" min="0" max="2" step="0.05" value="0.8"
        oninput="document.getElementById('tempVal').textContent=parseFloat(this.value).toFixed(2);saveSliders()">
      <div class="ctx-hint">低=稳定保守 · 高=发散创意</div>
    </div>

    <!-- TOP P -->
    <div class="slider-row">
      <div class="slider-label">
        <span>Top P</span>
        <span class="slider-val" id="topPVal">1.00</span>
      </div>
      <input type="range" id="topPSlider" min="0.01" max="1" step="0.01" value="1"
        oninput="document.getElementById('topPVal').textContent=parseFloat(this.value).toFixed(2);saveSliders()">
      <div class="ctx-hint">建议只调温度，Top P 保持 1.00</div>
    </div>

    <!-- CONTEXT -->
    <div class="slider-row">
      <div class="slider-label">
        <span>上下文条数</span>
        <span class="slider-val" id="ctxVal">10</span>
      </div>
      <input type="range" id="ctxSlider" min="2" max="40" step="2" value="10"
        oninput="document.getElementById('ctxVal').textContent=this.value;saveSliders()">
      <div class="ctx-hint">保留最近 N 条消息发给模型，越少越省钱</div>
    </div>

    <hr class="divider">

    <div class="field">
      <label>系统提示词</label>
      <textarea id="systemPrompt" placeholder="在这里写4o酱的人设..."></textarea>
    </div>

    <hr class="divider">

    <div class="field">
      <div class="mem-header">
        <label>记忆</label>
        <span class="mem-count" id="memCount">0 条</span>
      </div>
      <textarea id="memoryText" placeholder="还没有记忆，聊完点「保存记忆」～"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="saveMemBtn" onclick="saveMemory()">💾 保存记忆</button>
      <button class="btn danger" onclick="clearMemory()">清空记忆</button>
      <button class="btn danger" onclick="clearChat()">清空对话</button>
    </div>

  </div>
</div>

<div class="messages" id="messages">
  <div class="empty-state" id="emptyState">
    <div class="big">🐙</div>
    <p>在这里和4o酱说话～</p>
  </div>
</div>

<div class="input-area">
  <textarea id="userInput" placeholder="说点什么..." rows="1" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
</div>

<script>
const MODEL = 'gpt-4o-2024-11-20';
let messages = [], isLoading = false, drawerOpen = false;

window.onload = () => {
  document.getElementById('apiKey').value = localStorage.getItem('oai_key') || '';
  document.getElementById('systemPrompt').value = localStorage.getItem('oai_sys') || '';
  document.getElementById('memoryText').value = localStorage.getItem('oai_memory') || '';

  const temp = localStorage.getItem('oai_temp') || '0.8';
  const topp = localStorage.getItem('oai_topp') || '1';
  const ctx  = localStorage.getItem('oai_ctx')  || '10';
  document.getElementById('tempSlider').value = temp;
  document.getElementById('topPSlider').value = topp;
  document.getElementById('ctxSlider').value  = ctx;
  document.getElementById('tempVal').textContent = parseFloat(temp).toFixed(2);
  document.getElementById('topPVal').textContent  = parseFloat(topp).toFixed(2);
  document.getElementById('ctxVal').textContent   = ctx;

  updateMemCount();

  ['apiKey','systemPrompt','memoryText'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const keys = {apiKey:'oai_key', systemPrompt:'oai_sys', memoryText:'oai_memory'};
      localStorage.setItem(keys[id], document.getElementById(id).value);
      if (id === 'memoryText') updateMemCount();
    });
  });

  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
      e.preventDefault(); sendMessage();
    }
  });
};

function saveSliders() {
  localStorage.setItem('oai_temp', document.getElementById('tempSlider').value);
  localStorage.setItem('oai_topp', document.getElementById('topPSlider').value);
  localStorage.setItem('oai_ctx',  document.getElementById('ctxSlider').value);
}

function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('drawer').classList.toggle('open', drawerOpen);
  document.getElementById('settingsBtn').classList.toggle('active', drawerOpen);
}

function updateMemCount() {
  const mem = document.getElementById('memoryText').value.trim();
  const n = mem ? mem.split('\n').filter(l => l.trim()).length : 0;
  document.getElementById('memCount').textContent = n + ' 条';
}

function getContextMessages() {
  const limit = parseInt(document.getElementById('ctxSlider').value);
  return messages.slice(-limit);
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { setStatus('请先在设置填 API Key'); return; }

  const es = document.getElementById('emptyState');
  if (es) es.remove();

  input.value = ''; input.style.height = 'auto';
  messages.push({ role: 'user', content: text });
  renderMessage('user', text, null);

  // show context indicator
  const ctxLimit = parseInt(document.getElementById('ctxSlider').value);
  if (messages.length > ctxLimit) {
    showCtxIndicator(ctxLimit);
  }

  const typingEl = showTyping();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  setStatus('思考中...');

  const temperature = parseFloat(document.getElementById('tempSlider').value);
  const top_p = parseFloat(document.getElementById('topPSlider').value);

  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL,
        temperature,
        top_p,
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          ...getContextMessages()
        ]
      })
    });
    typingEl.remove();
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || '请求失败'); }
    const data = await res.json();
    const reply = data.choices[0].message.content;
    const tokens = data.usage?.completion_tokens ?? null;
    const totalTokens = data.usage?.total_tokens ?? null;
    messages.push({ role: 'assistant', content: reply });
    renderMessage('assistant', reply, tokens);
    setStatus(`就绪 · 共 ${totalTokens ?? '?'} tokens`);
  } catch(e) {
    typingEl.remove();
    renderMessage('assistant', '❌ ' + e.message, null);
    setStatus('出错了');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

function buildSystemPrompt() {
  const sys = document.getElementById('systemPrompt').value.trim();
  const mem = document.getElementById('memoryText').value.trim();
  let p = sys || '你是一个聪明、温暖的AI助手。';
  if (mem) p += '\n\n---\n以下是你记住的关于用户的信息，请自然地融入对话中：\n' + mem;
  return p;
}

async function saveMemory() {
  if (!messages.length) { setStatus('没有对话可以总结'); return; }
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { setStatus('请先填写 API Key'); return; }
  const btn = document.getElementById('saveMemBtn');
  btn.disabled = true; btn.textContent = '提炼中...'; setStatus('提炼记忆...');
  const existingMem = document.getElementById('memoryText').value.trim();
  const convo = messages.map(m => `${m.role==='user'?'用户':'AI'}：${m.content}`).join('\n\n');
  try {
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: MODEL, max_tokens: 600, temperature: 0.3,
        messages: [{ role: 'user', content: `请从下面的对话提取用户的关键信息，与已有记忆合并，形成简洁要点列表。\n\n已有记忆：\n${existingMem||'（无）'}\n\n新对话：\n${convo}\n\n请提炼：用户个人信息、偏好、正在进行的事、重要情感背景、需要记住的细节。格式：每条「- 」开头，一行一条，中文，简洁。只输出要点，不要其他内容。` }]
      })
    });
    if (!res.ok) throw new Error('提炼失败');
    const data = await res.json();
    const newMem = data.choices[0].message.content.trim();
    document.getElementById('memoryText').value = newMem;
    localStorage.setItem('oai_memory', newMem);
    updateMemCount(); setStatus('记忆已保存 ✓');
  } catch(e) { setStatus('失败：' + e.message); }
  btn.disabled = false; btn.textContent = '💾 保存记忆';
}

function clearMemory() {
  if (!confirm('确定清空记忆吗？')) return;
  document.getElementById('memoryText').value = '';
  localStorage.removeItem('oai_memory');
  updateMemCount(); setStatus('记忆已清空');
}

function clearChat() {
  if (!confirm('确定清空当前对话吗？')) return;
  messages = [];
  document.getElementById('messages').innerHTML =
    '<div class="empty-state" id="emptyState"><div class="big">🐙</div><p>在这里和4o酱说话～</p></div>';
  setStatus('对话已清空');
}

function renderMessage(role, content, tokens) {
  const c = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const now = new Date().toLocaleTimeString('zh',{hour:'2-digit',minute:'2-digit'});
  const tokenBadge = tokens != null
    ? `<span class="msg-tokens">${tokens} tok</span>` : '';
  div.innerHTML = `
    <div class="msg-role">${role==='user'?'你':'4o酱'}</div>
    <div class="msg-bubble">${escapeHtml(content)}</div>
    <div class="msg-meta">
      <span class="msg-time">${now}</span>
      ${tokenBadge}
    </div>`;
  c.appendChild(div); c.scrollTop = c.scrollHeight;
}

function showCtxIndicator(limit) {
  const c = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'ctx-indicator';
  div.textContent = `↑ 仅发送最近 ${limit} 条`;
  c.appendChild(div);
}

function showTyping() {
  const c = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.innerHTML = `<div class="msg-role">4o酱</div><div class="typing"><span></span><span></span><span></span></div>`;
  c.appendChild(div); c.scrollTop = c.scrollHeight;
  return div;
}

function setStatus(msg) { document.getElementById('headerStatus').textContent = msg; }

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 110) + 'px';
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
